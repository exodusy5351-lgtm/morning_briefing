name: Daily Insurance Briefing Automated Pipeline

on:
  schedule:
    - cron: '0 21 * * *'      # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests google-genai python-dotenv

      - name: Run Daily Briefing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: python briefing_agent.py --ci

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/threads_hot.json recent_published_urls.json
          git diff --staged --quiet || git commit -m "chore: 아침 브리핑 자동 갱신 $(date +%Y-%m-%d)"
          git push
